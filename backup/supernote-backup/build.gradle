
plugins {
    id "application"
    id "com.gradleup.shadow" version "9.6.1"
}

version = "0.3"

application {
    mainClass = "com.kdiller.supernote.backup.Application"
}

repositories {
    mavenCentral()
}

dependencies {
    // Logging library
    implementation 'ch.qos.logback:logback-classic:1.2.11'
    
    // JSON Parsing
    implementation 'org.json:json:20230618'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}


clean.doFirst{
    delete "log"
}
